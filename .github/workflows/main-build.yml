name: "Main Branch Build"

# Wisprfree: builds an unsigned macOS app on every push to main (and on
# demand) and keeps it as a downloadable artifact for 30 days. Signing needs
# Handy's Apple certificate, which this fork doesn't have, so the app is
# ad-hoc signed and must be opened once with right-click > Open.

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26" # Apple Silicon (M1 and later)
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "macos-latest" # Intel
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      asset-prefix: "wisprfree"
      upload-artifacts: true
      sign-binaries: false
    secrets: inherit
